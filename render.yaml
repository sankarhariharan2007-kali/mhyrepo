# Render Blueprint: New -> Blueprint, pick this repo. Creates the web service and a Postgres database.
databases:
  - name: sauna-db
    plan: free
    databaseName: steam_db
    user: sauna

services:
  - type: web
    name: sauna
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/init_db.py && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: sauna-db
          property: connectionString
      - key: SAUNA_SECRET_KEY
        generateValue: true
      - key: SAUNA_COOKIE_SECURE
        value: "1"
      - key: ENABLE_SQL_EXPLORER
        value: "1"
      - key: SEED_DEMO_DATA
        value: "1"
