# Render Blueprint: Flask web service + MySQL 8 private service (persistent disk).
# Option B (external managed MySQL, free web service): delete the `mysql` service
# below and set MYSQL_HOST/PORT/USER/PASSWORD/DB (+ MYSQL_SSL=1) on the web service.
services:
  - type: web
    name: ferro-y
    runtime: python
    plan: starter            # private-network access to the MySQL service
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/init_db.py && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: FERRO_SECRET_KEY
        generateValue: true
      - key: FERRO_COOKIE_SECURE
        value: "1"
      - key: ADMIN_USER_IDS
        value: "1"
      - key: ENABLE_SQL_EXPLORER
        value: "1"
      - key: SEED_DEMO_DATA
        value: "1"
      - key: MYSQL_DB
        value: steam_db
      - key: MYSQL_USER
        value: ferro
      - key: MYSQL_HOST
        fromService: {type: pserv, name: mysql, property: host}
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_PASSWORD
        sync: false          # enter the same value you set on the mysql service

  - type: pserv
    name: mysql
    runtime: docker
    dockerfilePath: ./mysql/Dockerfile
    dockerContext: ./mysql
    plan: starter
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 1
    envVars:
      - key: MYSQL_DATABASE
        value: steam_db
      - key: MYSQL_USER
        value: ferro
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_ROOT_PASSWORD
        sync: false
